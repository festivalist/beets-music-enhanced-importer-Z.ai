<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musik Import-Monitor</title>
<!--
  Import-Monitor, vom musik-Bot selbst ausgeliefert (Story 11.7).
  Grund für den Umzug aus dem MusicGrabber-Overlay: MG 4.4.1+ erzwingt
  eine CSP mit connect-src 'self' (HTTP-Header aus core/middleware.py —
  für das Static-Overlay nicht änderbar), womit Cross-Origin-Fetches
  gegen bot_http :8283 im Browser blockiert werden. Same-origin hier
  (dieser Server IST bot_http) braucht keine CSP-Ausnahme und koppelt
  den Monitor komplett vom MG-Overlay-Drift ab (ADR-0001).
-->
<style>
    :root { color-scheme: dark light; }
    body { font-family: system-ui, sans-serif; font-size: 14px; margin: 24px auto;
           max-width: 980px; padding: 0 16px; background: #14161a; color: #e8e6e3; }
    a { color: #8ab4f8; }
    h1 { font-size: 20px; margin: 0 0 4px 0; }
    .sub { opacity: .7; margin-bottom: 18px; }
    .mon-wrap { display: flex; flex-direction: column; gap: 14px; }
    .mon-head { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; opacity: .92; }
    .mon-box, .mon-rev, .mon-err { border: 1px solid rgba(128,128,128,.35); border-radius: 10px; padding: 10px 14px; }
    .mon-rev { border-color: rgba(230,170,60,.55); }
    .mon-err { border-color: rgba(220,80,80,.6); }
    .mon-box h3, .mon-rev h3 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
    .mon-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .mon-chip { cursor: pointer; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
    .mon-chip-on { background: rgba(128,128,128,.25); font-weight: 600; }
    .mon-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mon-table th, .mon-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid rgba(128,128,128,.18); vertical-align: top; }
    .mon-table th { opacity: .65; font-weight: 600; }
    .mon-mut { opacity: .65; }
    .mon-item { padding: 3px 0; }
    .mon-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .mon-act { cursor: pointer; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; border-radius: 6px; padding: 2px 10px; font-size: 12.5px; }
    .mon-act:hover { background: rgba(128,128,128,.18); }
    .mon-msg { border: 1px solid rgba(80,200,120,.5); border-radius: 10px; padding: 8px 14px; }
</style>
</head>
<body>
<h1>🎵 musik Import-Monitor</h1>
<div class="sub">vom musik-Bot ausgeliefert (bot_http :8283, same-origin) —
    <a href="#" id="mgLink">← zurück zur MusicGrabber-UI (:38274)</a> · Poll alle 5 s</div>
<div id="monitorContent"></div>
<script>
(function () {
    'use strict';

    const POLL_MS = 5000;
    const MAX_ROWS = 300;
    const STATUS_ORDER = ["review", "error", "network", "pending",
        "unmatched", "auto", "duplicate", "ignored"];
    const STATUS_LABELS = {
        auto: "auto", review: "Review", error: "Fehler", pending: "offen",
        unmatched: "unmatched", network: "Netz", duplicate: "Dubletten",
        ignored: "ignoriert"
    };

    let filter = null;
    let lastSnap = null;
    let lastReviewShown = [];
    let msgTimer = null;
    let msgText = null;   // überlebt Poll-Re-Renders
    // Story 3.3: Upgrade-Detail on-demand — der 5-s-Poll trägt nur die
    // Summary; die Kandidaten-Liste (1290+ Rows) kommt aus /api/upgrades
    // und nur, wenn sich scanned_ts geändert hat (oder Entscheidungen
    // upgDetailTs invalidieren).
    let upgDetail = null;
    let upgDetailTs = null;
    let upgFetching = false;
    const upgOpen = new Set();   // aufgeklappte Track-Listen überleben den 5-s-Poll

    const mgLink = document.getElementById("mgLink");
    if (mgLink) mgLink.href = location.protocol + "//" + location.hostname + ":38274/";

    function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;",
            '"': "&quot;", "'": "&#39;"
        }[c]));
    }

    function relAge(ts) {
        if (!ts) return "unbekannt";
        const d = Math.max(0, Date.now() / 1000 - ts);
        if (d < 90) return "gerade eben";
        if (d < 5400) return "vor " + Math.floor(d / 60) + " min";
        if (d < 172800) return "vor " + Math.floor(d / 3600) + " h";
        return "vor " + Math.floor(d / 86400) + " d";
    }

    function baseName(p) {
        const parts = String(p || "").split(/[\\/]/);
        return parts[parts.length - 1] || String(p || "?");
    }

    function headHtml(snap) {
        const ing = snap.ingest || {};
        const backlog = snap.backlog || {};
        const cur = snap.current;
        const act = (cur && cur.phase && cur.phase !== "idle")
            ? `🔄 Ingest: <b>${esc(cur.phase)}</b>${cur.detail ? " · " + esc(String(cur.detail).slice(0, 60)) : ""} · ${esc(relAge(cur.updated))}`
            : ing.busy === true ? "🔄 Ingest <b>läuft</b>"
                : ing.busy === false ? "💤 Ingest idle"
                    : "❓ Ingest-Status unbekannt";
        const br = backlog.by_root;
        const blStr = (backlog.audio_files != null)
            ? `📥 Stau: <b>${backlog.audio_files}</b> Datei(en)` +
              (br && Object.keys(br).length
                  ? " (" + Object.entries(br)
                      .map(([r, n]) => `${esc(r)} ${n}`).join(" · ") + ")"
                  : "")
            : "📥 Stau: ?";
        const retry = (ing.counts || {}).network
            ? `<button class="mon-act" id="monRetry">🔁 ${ing.counts.network} Netz-Unit(s) erneut versuchen</button>`
            : "";
        // Story 1.2 tooling: YouTube-Cookie-Frische (Cache, same snapshot)
        const ck = snap.cookie || {};
        const ckText = {
            fresh: "🍪 Cookie frisch",
            stale: "⚠️ Cookie ABGELAUFEN — Downloads nur 128 kbps!",
            missing: "⚠️ Cookie-Datei fehlt",
            off: "🍪 kein Cookie (128 kbps)",
            unknown: "❓ Cookie unklar",
            unchecked: "🍪 Cookie: noch nicht geprüft"
        }[ck.state] || "";
        const ckHot = ck.state === "stale" || ck.state === "missing";
        const ckAge = ck.file_age_days != null
            ? ` · ${ck.file_age_days} d alt` : "";
        const ckSpan = ckText
            ? `<span${ckHot ? ' style="color:#ff7b72;font-weight:600"' : ""}>` +
              `${esc(ckText)}${esc(ckAge)}</span>` : "";
        // Story 10.10: Nutzer-Entscheidungen, die auf ihren Ingest-Zyklus
        // warten (Spool) — sichtbar, bis sie wirklich ausgeführt sind
        const sp = snap.spool || {};
        const spSpan = sp.open
            ? `<span title="Monitor-Aktionen warten auf den nächsten ` +
              `Ingest-Zyklus">⏳ offene Nutzer-Entscheidungen: <b>` +
              `${sp.open}</b>${sp.oldest_queued
                  ? " · älteste " + esc(relAge(sp.oldest_queued)) : ""}` +
              `</span>`
            : "";
        return `<div class="mon-head"><span>${act}</span>` +
            `<span>🗄 <b>${ing.total ?? 0}</b> Unit(s)</span>` +
            `<span>⏱ letzte Änderung ${esc(relAge(ing.last_change))}</span>` +
            `<span>${blStr}</span>${ckSpan}${spSpan}` +
            `<span><button class="mon-act" id="monIngest">🔄 Ingest jetzt</button> ${retry}</span></div>`;
    }

    function reviewHtml(review) {
        lastReviewShown = (review || []).slice(0, 20);
        if (!lastReviewShown.length) {
            return '<div class="mon-box"><h3>Review-Queue</h3>' +
                '<div class="mon-item">✅ nichts wartet</div></div>';
        }
        const items = lastReviewShown.map((u, i) => {
            const g = u.guessed || {};
            const label = [g.artist, g.album].filter(Boolean).join(" - ")
                || baseName(u.path);
            const cands = (u.candidates || []).map((c, ci) =>
                `<button class="mon-act" data-rev="${i}" data-dec="${ci ? "accept2" : "accept"}">K${ci + 1}: ${esc([c.artist, c.album].filter(Boolean).join(" - ") || c.source || "?")}${c.year ? " (" + c.year + ")" : ""} · ${c.n_tracks ?? "?"} Tracks</button>`);
            return `<div class="mon-item">` +
                `<div>⚠️ <b>${esc(label)}</b> <span class="mon-mut">· ${u.n_files ?? "?"} Datei(en) · ${esc(relAge(u.updated))}${u.reason ? " · " + esc(String(u.reason).slice(0, 120)) : ""}</span></div>` +
                `<div class="mon-acts">${cands.join("")}` +
                `<button class="mon-act" data-rev="${i}" data-dec="asis">📦 As-is (eigene Tags)</button>` +
                `<button class="mon-act" data-rev="${i}" data-dec="override">✏️ Override…</button>` +
                `<button class="mon-act" data-rev="${i}" data-dec="ignore">🔇 Ignorieren</button>` +
                `</div></div>`;
        }).join("");
        const more = (review || []).length > 20
            ? `<div class="mon-item mon-mut">… und ${review.length - 20} weitere</div>` : "";
        return `<div class="mon-rev"><h3>⚠️ Review-Queue: ${review.length} Unit(s) warten auf eine Entscheidung</h3>${items}${more}</div>`;
    }

    function jobsHtml(jobs) {
        if (!jobs) return "";
        const parts = [];
        if (jobs.running_job) {
            parts.push(`<div class="mon-item">🔄 läuft: ${esc(String(jobs.running_job.text || "").slice(0, 100))}</div>`);
        } else {
            parts.push('<div class="mon-item">💤 keine Bot-Jobs aktiv</div>');
        }
        parts.push(`<div class="mon-item mon-mut">⏳ wartend: ${jobs.queued ?? 0}</div>`);
        for (const j of (jobs.recent || []).slice(0, 5)) {
            const icon = j.status === "done" ? "✅" : "❌";
            const head = String(j.summary || j.text || "").split("\n")[0].slice(0, 110);
            const age = j.finished ? ` · ${esc(relAge(j.finished))}` : "";
            parts.push(`<div class="mon-item mon-mut">${icon} ${esc(head)}${age}</div>`);
        }
        return `<div class="mon-box"><h3>Bot-Jobs (Telegram + Monitor)</h3>${parts.join("")}</div>`;
    }

    function unitsHtml(ing) {
        const counts = ing.counts || {};
        const chips = STATUS_ORDER.filter(s => counts[s]).map(s =>
            `<button class="mon-chip${filter === s ? " mon-chip-on" : ""}" data-st="${s}">${STATUS_LABELS[s] || s} ${counts[s]}</button>`).join("");
        let units = ing.units || [];
        if (filter) units = units.filter(u => u.status === filter);
        const rows = units.slice(0, MAX_ROWS).map(u =>
            `<tr><td title="${esc(u.path)}">${esc(baseName(u.path))}</td><td>${esc(STATUS_LABELS[u.status] || u.status)}</td><td>${esc(String(u.reason || "").slice(0, 120))}</td><td>${u.n_files ?? "?"}</td><td>${esc(relAge(u.updated))}</td></tr>`).join("");
        const hint = units.length > MAX_ROWS
            ? `<div class="mon-mut" style="margin-top:6px">… ${units.length - MAX_ROWS} weitere — Filter benutzen</div>` : "";
        return `<div class="mon-box"><h3>Units${filter ? ` — Filter: ${STATUS_LABELS[filter] || filter}` : ""}</h3>` +
            `<div class="mon-chips">${chips || '<span class="mon-mut">keine Units</span>'}</div>` +
            `<table class="mon-table" style="margin-top:8px"><thead><tr><th>Unit</th><th>Status</th><th>Grund</th><th>Dateien</th><th>geändert</th></tr></thead><tbody>${rows}</tbody></table>${hint}</div>`;
    }

    // -- Story 3.3: Upgrades (lossy → besser) --------------------------------

    const UPG_STATUS_LABELS = {
        queued: "bereit", running: "🔄 läuft", done: "✅ fertig",
        error: "❌ Fehler", "ingest-pending": "⏳ wartet auf Ingest"
    };

    function upgResultsLine(res) {
        if (!res || res.replaced == null) return "";
        const parts = [`${res.replaced} ersetzt`, `${res.kept ?? 0} behalten`,
            `${res.no_source ?? 0} ohne Quelle`];
        if (res.gone) parts.push(`${res.gone} weg`);
        let s = " · " + parts.join(" · ");
        if (res.dup_risk && res.dup_risk.length)
            s += ` · ⚠️ ${res.dup_risk.length} prüfen`;
        return `<span class="mon-mut">${esc(s)}</span>`;
    }

    function upgTrackRow(c) {
        const kept = c.decision === "keep";
        const statusIcon = c.status === "downloaded" ? "⬇️"
            : c.status === "kept-user" || kept ? "🔇"
                : c.status === "no-source" ? "∅" : "";
        const src = c.source ? ` · ${esc(c.source)} ${esc(c.quality || "")}` : "";
        return `<div class="mon-item">` +
            `<span class="mon-mut">${statusIcon} ${esc(c.kbps)}k ${esc(c.format)}</span> ` +
            `<b>${esc(c.artist)}</b> — ${esc(c.title)} ` +
            `<span class="mon-mut">· ${esc(c.album)}${c.track ? " (" + c.track + ")" : ""}${src}</span> ` +
            `<button class="mon-act" data-upgdec="${c.id}" data-cur="${kept ? "keep" : ""}" ` +
            `title="${kept ? "Wieder zum Nachladen freigeben" : "Diesen Track behalten (nicht nachladen)"}">` +
            `${kept ? "🔊 Freigeben" : "🔇 Behalten"}</button></div>`;
    }

    function upgBatchHtml(b) {
        const canRun = ["queued", "error", "ingest-pending"].includes(b.status);
        const items = b.items || [];
        const rows = items.slice(0, 130).map(upgTrackRow).join("");
        const more = items.length > 130
            ? `<div class="mon-item mon-mut">… ${items.length - 130} weitere (Report: reports/upgrade-report.md)</div>` : "";
        const runBtn = canRun
            ? ` <button class="mon-act" data-upgbatch="${esc(b.id)}" title="Batch via MusicGrabber neu nachladen; der Import-Vergleich behält automatisch die bessere Kopie">⬇️ Nachladen</button>` : "";
        const res = b.results && b.results.replaced != null
            ? upgResultsLine(b.results) : "";
        const dup = (b.results && b.results.dup_risk || []).map(d =>
            `<div class="mon-item">⚠️ ${esc(d)}</div>`).join("");
        return `<div class="mon-item">` +
            `<b>${esc(b.id.replace(/^upg-\d+-/, ""))}</b> — ${b.n} Tracks ` +
            `<span class="mon-mut">${UPG_STATUS_LABELS[b.status] || b.status}${res}</span>${runBtn}` +
            `<details id="upgdet-${esc(b.id)}" style="margin-top:2px"${upgOpen.has(b.id) ? " open" : ""}><summary class="mon-mut" style="cursor:pointer">Tracks anzeigen</summary>${rows}${more}${dup}</details></div>`;
    }

    function upgradesHtml(sum) {
        if (!sum || !sum.scanned_ts) {
            return `<div class="mon-box"><h3>⬆️ Upgrades (lossy → besser)</h3>` +
                `<div class="mon-item mon-mut">Noch kein Scan — findet lossy-Tracks unter der Qualitätsschwelle und plant Nachladen-Batches.</div>` +
                `<div class="mon-acts"><button class="mon-act" id="monUpgScan">🔍 Scan jetzt</button></div></div>`;
        }
        const d = upgDetail;
        const batches = (d && d.batches) || [];
        const queued = batches.filter(b => b.status === "queued");
        const kept = (d && d.candidates || []).filter(c => c.decision === "keep");
        const keptRows = kept.slice(0, 40).map(upgTrackRow).join("");
        const keptMore = kept.length > 40
            ? `<div class="mon-item mon-mut">… ${kept.length - 40} weitere</div>` : "";
        const body = d
            ? (queued.length
                ? queued.map(upgBatchHtml).join("") +
                  (batches.some(b => b.status !== "queued")
                    ? `<details style="margin-top:6px"><summary class="mon-mut" style="cursor:pointer">Frühere Batches (${batches.length - queued.length})</summary>` +
                      batches.filter(b => b.status !== "queued").map(upgBatchHtml).join("") + `</details>`
                    : "")
                : batches.map(upgBatchHtml).join("") +
                  `<div class="mon-item mon-mut">keine offenen Batches — nach einem Rescan erscheinen neue</div>`)
            : `<div class="mon-item mon-mut">lädt Kandidaten …</div>`;
        const keptBox = kept.length
            ? `<details id="upgkept" style="margin-top:6px"${upgOpen.has("upgkept") ? " open" : ""}><summary class="mon-mut" style="cursor:pointer">Behalten: ${kept.length} Track(s) — nicht nachladen</summary>${keptRows}${keptMore}</details>` : "";
        return `<div class="mon-box"><h3>⬆️ Upgrades (lossy → besser): ${sum.total} Kandidaten < ${esc(sum.threshold_kbps)} kbps · Scan ${esc(relAge(sum.scanned_ts))} · Batches à ≤ ${esc(sum.batch_size)}</h3>` +
            body + keptBox +
            `<div class="mon-acts"><button class="mon-act" id="monUpgScan">🔍 Scan jetzt</button></div>` +
            `<div class="mon-item mon-mut" style="margin-top:6px">Nachladen = MusicGrabber sucht jede Quelle (lossless first); der Import-Vergleich behält automatisch die bessere Kopie, der Verlierer geht nach _trash. Keine Quelle / nicht besser = dokumentiertes Ergebnis, kein Schaden.</div></div>`;
    }

    function setError(msg) {
        const el = document.getElementById("monitorErr");
        if (!el) return;
        el.style.display = msg ? "" : "none";
        if (msg) el.textContent = msg;
    }

    function setMsg(msg) {
        msgText = msg;
        const el = document.getElementById("monitorMsg");
        if (!el) return;
        el.style.display = msg ? "" : "none";
        if (msg) el.textContent = msg;
        clearTimeout(msgTimer);
        if (msg) msgTimer = setTimeout(() => {
            msgText = null;
            el.style.display = "none";
        }, 8000);
    }

    async function postAction(payload) {
        try {
            const r = await fetch("/api/action", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const out = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(out.error || "HTTP " + r.status);
            rememberJob(out.queued);
            setMsg("✅ Auftrag " + (out.queued || "") +
                " angenommen — Ergebnis unten bei „Meine Aufträge“.");
            tick();
        } catch (e) {
            setError("Aktion fehlgeschlagen: " + e.message);
        }
    }

    function myJobs() {
        try {
            return JSON.parse(sessionStorage.getItem("monJobs") || "[]");
        } catch (e) {
            return [];
        }
    }

    function rememberJob(id) {
        if (!id) return;
        const jobs = myJobs().filter(j => j !== id);
        jobs.unshift(id);
        sessionStorage.setItem("monJobs", JSON.stringify(jobs.slice(0, 8)));
    }

    function myJobsHtml(jobsAll) {
        const ids = myJobs();
        if (!ids.length) return "";
        const byId = {};
        for (const j of (jobsAll || [])) byId[j.id] = j;
        const rows = ids.map(id => {
            const j = byId[id];
            if (!j) {
                return `<div class="mon-item mon-mut">⏳ ${esc(id)} ` +
                    "(wartet auf Ausführung…)</div>";
            }
            const icon = j.status === "done" ? "✅"
                : j.status === "error" ? "❌"
                    : j.status === "running" ? "🔄" : "⏳";
            const head = String(j.summary || j.text || "")
                .split("\n")[0].slice(0, 120);
            const age = j.created ? ` · ${esc(relAge(j.created))}` : "";
            return `<div class="mon-item">${icon} ${esc(head)}${age}</div>`;
        }).join("");
        return `<div class="mon-box"><h3>Meine Aufträge (diese Sitzung)</h3>${rows}</div>`;
    }

    function doReview(u, dec) {
        if (!u) return;
        const name = baseName(u.path);
        if (dec === "asis") {
            if (!confirm("As-is-Import auf die eigenen Tags? Schreibt die Bibliothek.\n" + name)) return;
            postAction({ action: "asis", unit_paths: [u.path] });
        } else if (dec === "ignore") {
            if (!confirm("Unit ignorieren (kein Import, reversibel über State)?\n" + name)) return;
            postAction({ action: "review", decisions: [{ unit_path: u.path, decision: "ignore" }] });
        } else if (dec === "override") {
            const spec = prompt("Override — Format: Artist|Album|MBID (Felder leer lassen = unverändert; MBID schlägt Suche)");
            if (spec === null) return;
            const parts = spec.split("|").map(s => s.trim());
            const artist = parts[0] || "", album = parts[1] || "", mbid = parts[2] || "";
            if (!artist && !album && !mbid) { alert("Override ohne Felder — abgebrochen."); return; }
            if (!confirm("Override-Import ausführen? Schreibt die Bibliothek.\n" + name)) return;
            postAction({ action: "review", decisions: [{ unit_path: u.path, decision: "override", override_artist: artist, override_album: album, override_mbid: mbid }] });
        } else { // accept / accept2
            if (!confirm("Mit diesem Kandidaten importieren? Schreibt die Bibliothek.\n" + name)) return;
            postAction({ action: "review", decisions: [{ unit_path: u.path, decision: dec }] });
        }
    }

    function render(snap) {
        const box = document.getElementById("monitorContent");
        if (!box) return;
        box.innerHTML =
            `<div class="mon-wrap">` +
            `<div id="monitorErr" class="mon-err" style="display:none"></div>` +
            `<div id="monitorMsg" class="mon-msg" style="display:${msgText ? "" : "none"}">${esc(msgText || "")}</div>` +
            myJobsHtml(snap.jobs_all) +
            headHtml(snap) +
            reviewHtml(snap.review) +
            upgradesHtml(snap.upgrades) +
            jobsHtml(snap.jobs) +
            unitsHtml(snap.ingest || {}) +
            `</div>`;
        box.querySelectorAll(".mon-chip").forEach(ch =>
            ch.addEventListener("click", () => {
                filter = (filter === ch.dataset.st) ? null : ch.dataset.st;
                if (lastSnap) render(lastSnap);
            }));
        box.querySelectorAll(".mon-act[data-rev]").forEach(b =>
            b.addEventListener("click", () =>
                doReview(lastReviewShown[Number(b.dataset.rev)], b.dataset.dec)));
        const upgScan = document.getElementById("monUpgScan");
        if (upgScan) upgScan.addEventListener("click", () => {
            if (confirm("Upgrade-Kandidaten neu scannen? (liest die Bibliothek, schreibt nur Report/Plan)")) {
                upgDetailTs = null;
                postAction({ action: "upgrade_scan" });
            }
        });
        box.querySelectorAll(".mon-act[data-upgbatch]").forEach(b =>
            b.addEventListener("click", () => {
                if (confirm(`Batch ${b.dataset.upgbatch} jetzt nachladen? MusicGrabber lädt die Tracks neu; der Import behält automatisch die bessere Kopie (Verlierer nach _trash). Läuft länger — Fortschritt bei den Bot-Jobs.`)) {
                    postAction({ action: "upgrade_batch", batch_id: b.dataset.upgbatch });
                }
            }));
        box.querySelectorAll(".mon-act[data-upgdec]").forEach(b =>
            b.addEventListener("click", () => {
                const keep = b.dataset.cur !== "keep";
                postAction({ action: "upgrade_decide", item_ids: [Number(b.dataset.upgdec)], decision: keep ? "keep" : null });
                upgDetailTs = null;  // Detail nach der Entscheidung neu laden
            }));
        // Offen-Zustand der Upgrade-Track-Listen über Poll-Re-Renders retten
        box.querySelectorAll("details[id^='upgdet'], details#upgkept").forEach(d =>
            d.addEventListener("toggle", () => {
                if (d.open) upgOpen.add(d.id);
                else upgOpen.delete(d.id);
            }));
        const ingest = document.getElementById("monIngest");
        if (ingest) ingest.addEventListener("click", () => {
            if (confirm("Ingest-Lauf jetzt anstoßen? (scannt Staging und importiert)")) postAction({ action: "ingest" });
        });
        const retry = document.getElementById("monRetry");
        if (retry) retry.addEventListener("click", () => {
            if (confirm("Alle Netzwerk-Units zurück auf pending setzen? Der nächste Ingest versucht sie erneut.")) postAction({ action: "retry" });
        });
    }

    async function fetchUpgDetail() {
        if (upgFetching) return;
        upgFetching = true;
        try {
            const r = await fetch("/api/upgrades");
            if (!r.ok) throw new Error("HTTP " + r.status);
            upgDetail = await r.json();
            upgDetailTs = upgDetail.scanned_ts;
            if (lastSnap) render(lastSnap);
        } catch (e) {
            setError("Upgrade-Detail nicht ladbar (" + e.message + ")");
        } finally {
            upgFetching = false;
        }
    }

    async function tick() {
        try {
            const r = await fetch("/api/status");
            if (!r.ok) throw new Error("HTTP " + r.status);
            lastSnap = await r.json();
            render(lastSnap);
            setError(null);
            // Story 3.3: Kandidaten-Liste nur bei geändertem Scan-Stand
            // nachladen (Entscheidungs-Buttons invalidieren upgDetailTs)
            const ts = (lastSnap.upgrades || {}).scanned_ts;
            if (ts && ts !== upgDetailTs) fetchUpgDetail();
        } catch (e) {
            setError("Endpoint nicht erreichbar (" + e.message + ") — läuft der musik-Bot?");
        }
    }

    tick();
    setInterval(() => { if (!document.hidden) tick(); }, POLL_MS);
})();
</script>
</body>
</html>
