# MusicGrabber — Beschaffungs-Engine Nr. 2 (neben spotDL/SomeDL).
# Rollenverteilung (Nordstern / SCOPE-Change 2026-10-08): MusicGrabber
# beschafft ausschließlich bis ins Staging; beets/musik bleibt die einzige
# Instanz, die die echte Bibliothek schreibt. Deshalb mounten wir NUR das
# Staging-Unterverzeichnis — die Bibliothek selbst bleibt für den Container
# unsichtbar (Duplikat-/Qualitätshoheit liegt bei der musik-Pipeline).
# Image ist multi-arch (amd64+arm64) und läuft unverändert auf dem Pi 5.
# Story 9.3 (ADR-0001): Image GEPINNT, Updates bewusst per Tag-Bump mit
# Overlay-Verträglichkeitscheck (overlay/README.md). Die statischen UI-
# Dateien werden aus dem Repo-Checkout überlagert (Import-Monitor-Tab,
# EPIC 9) — das Upstream-Backend bleibt unangetastet.
services:
  musicgrabber:
    image: g33kphr33k/musicgrabber:4.5.3   # gepinnt; Bump nur mit Overlay-Check
        # (overlay/README.md). 4.5.3-Flip (Story 11.2, 2026-11-13): 4.4.1 hat
        # app.js in js/ (12 Dateien) gesplittet + erzwingt CSP — Overlay neu
        # vendored AUS DEM IMAGE (GitLab-Repo hat 4.5.1–4.5.3 nicht publiziert,
        # nur Docker-Hub-Tags), Monitor-Stellen jetzt index.html + js/core.js.
        # App wohnt seit 4.4 in /opt/musicgrabber (Mount unten unverändert) —
        # falscher Mount-Pfad lässt den Monitor-Tab STILL verschwinden.
    container_name: musicgrabber
    restart: unless-stopped
    ports:
      - "38274:8080"          # Web-UI/API, nur LAN — kein Port-Forwarding/Remote Access
    shm_size: 2gb             # Pi 5 (>=4 GB RAM); bei Knappheit auf 1gb reduzieren und beobachten
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
      - MUSIC_DIR=/music
      # KEIN API_KEY setzen: ein gesetzter Key erzwingt Authentifizierung auf
      # ALLEN API-Wegen, während die UI defaultmäßig ohne Login arbeitet —
      # der Browser könnte den Key nie mitschicken (dauerhaft 401 auf
      # Settings/Suche, passiert 2026-10-08). LAN-only ohne Port-Forwarding
      # ist der No-Login-Default die richtige Betriebsart; für Bot-Routing
      # (Story 2.4) später MGs User-System sauber aktivieren.
      # Quellen-/Qualitäts-Einstellungen lieber im Settings-Tab der UI
      # pflegen — ENV-Variaben überschreiben und locken die UI-Werte.
    volumes:
      - ./data:/data                                  # sqlite-Index + App-Daten (persistent!)
      - /mnt/music/_incoming/musicgrabber:/music      # Staging = MGs einziger Schreibbereich
      - ./overlay/static:/opt/musicgrabber/static:ro   # Overlay-UI (ADR-0001): unsere statischen Dateien, read-only; seit 4.4.0 /opt/musicgrabber (vorher /app/static)
