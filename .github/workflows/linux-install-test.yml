# Tests install.sh on clean Ubuntu VMs — x64 and arm64 (arm64 matches the
# Raspberry Pi target). Validates the whole Linux install path: apt tools,
# venv, pip deps (spotdl/somedl), Deno, setup wizard (non-interactive),
# fetch self-test. The netzfreie smoke suite (Story 6.6) runs in its own
# `smokes` job so it stays green while the install chain waits on the
# deliberately-open plex/musicgrabber modules (Dell box).
name: linux-install-test

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.d/**"
      - "requirements.txt"
      - "musik/**"
      - "manual_tests/**"
      - ".github/workflows/linux-install-test.yml"
  workflow_dispatch:

jobs:
  # Story 6.6: the netzfreie smoke suite in its OWN job — the install
  # chain currently ends non-zero on the deliberately-open modules
  # (plex/musicgrabber, awaiting the Dell box), which would keep the
  # suite step below from ever running.
  smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pi parity (the Pi runs 3.13): pin instead of the runner's moving
      # default (ubuntu-latest = 26 now, newer python than some deps built)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: venv + deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Smoke suite (manual_tests, network-free)
        run: |
          set -o pipefail
          if .venv/bin/python manual_tests/run_smokes.py 2>&1 | tee smokes.log; then
            exit 0
          fi
          # job logs need repo-admin; surface the failure tails as
          # error annotations (public check-runs API, max 10/step)
          grep -A 20 "^FAIL" smokes.log | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          tail -n 10 smokes.log | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          exit 1

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest        # x86-64
          - runner: ubuntu-24.04-arm     # aarch64 (Raspberry Pi arch)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh
        run: |
          set -o pipefail
          if bash install.sh --no-systemd --library "$HOME/Music" 2>&1 | tee install.log; then
            exit 0
          fi
          # surface the log tail as error annotations (readable via the
          # public check-runs API when log download needs auth;
          # GitHub caps annotations at 10 per step)
          tail -n 10 install.log | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          exit 1

      - name: Self test (spotdl / somedl / ffmpeg / fpcalc)
        run: .venv/bin/python musik.py fetch --self-test

      - name: CLI smoke test (classify + config render)
        run: |
          .venv/bin/python - <<'EOF'
          from musik.fetch import classify
          from musik.setup import CONFIG_TEMPLATE
          assert classify("https://open.spotify.com/album/4yP0hdKOZPNshxUOjY0cZj") == [
              ("spotify", "https://open.spotify.com/album/4yP0hdKOZPNshxUOjY0cZj")]
          assert classify("https://youtu.be/dQw4w9WgXcQ")[0][0] == "youtube"
          assert classify("Nirvana - Smells Like Teen Spirit") == [
              ("search", "Nirvana - Smells Like Teen Spirit")]
          cfg = CONFIG_TEMPLATE.format(
              library="X", db_file="Y", trash_dir="Z", tokenfile="T",
              discogs_line="", telegram_tokenfile="tt.json")
          assert "bot_allowlist" in cfg and "retry_rounds" in cfg
          print("classify + config template OK")
          EOF

      - name: doctor quick run (library bootstrap on Linux)
        run: |
          set -o pipefail
          if .venv/bin/python musik.py doctor --quick --limit 3 2>&1 | tee doctor.log; then
            exit 0
          fi
          tail -n 10 doctor.log | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          exit 1
